services:
  web:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - WATCHPACK_POLLING=true
      - WHISPER_URL=http://whisper:9000
    depends_on:
      - whisper
    env_file:
      - path: .env.local
        required: false

  whisper:
    build: ./whisper
    environment:
      - WHISPER_MODEL=small
    volumes:
      - whisper_models:/models

volumes:
  whisper_models:
  node_modules:
  next_cache:
